name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  drogonsec:
    name: Scan com Drogonsec
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Descarregar as dependências do backend
        run: sh ./mvnw -B -q dependency:resolve

      - name: Correr o Drogonsec
        # O Drogonsec termina com erro quando encontra vulnerabilidades
        # HIGH ou CRITICAL. Nesta versão o scan só informa e não bloqueia o PR.
        continue-on-error: true
        run: >
          docker run --rm
          --user "$(id -u):$(id -g)"
          -v "$PWD":/scan
          -v "$HOME/.m2/repository":/m2/repository:ro
          -e MAVEN_OPTS=-Dmaven.repo.local=/m2/repository
          ghcr.io/filipi86/drogonsec:3e8b5a685ec0944d1cedd6b7f4c905bf8ccd4dc7
          scan /scan --format html --output /scan/drogonsec-report.html

      - name: Resumir o resultado do scan
        id: resumo
        if: always()
        run: |
          if [ ! -f drogonsec-report.html ]; then
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
            echo "O scan não gerou relatório." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          valor() {
            grep -oP "<div class=\"number[^\"]*\">\K[0-9]+(?=</div><div class=\"label\">$1</div>)" drogonsec-report.html | head -1
          }

          total=$(valor "Total Findings")
          critical=$(valor "Critical")
          high=$(valor "High")
          medium=$(valor "Medium")
          low=$(valor "Low")

          {
            echo "disponivel=true"
            echo "total=$total"
            echo "critical=$critical"
            echo "high=$high"
            echo "medium=$medium"
            echo "low=$low"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Resultado do scan de segurança"
            echo ""
            echo "| Severidade | Avisos |"
            echo "|---|---|"
            echo "| Critical | $critical |"
            echo "| High | $high |"
            echo "| Medium | $medium |"
            echo "| Low | $low |"
            echo "| **Total** | **$total** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar o resumo no PR
        if: always() && github.event_name == 'pull_request' && steps.resumo.outputs.disponivel == 'true'
        uses: actions/github-script@v7
        env:
          TOTAL: ${{ steps.resumo.outputs.total }}
          CRITICAL: ${{ steps.resumo.outputs.critical }}
          HIGH: ${{ steps.resumo.outputs.high }}
          MEDIUM: ${{ steps.resumo.outputs.medium }}
          LOW: ${{ steps.resumo.outputs.low }}
        with:
          script: |
            const marcador = '<!-- drogonsec-resumo -->';
            const { owner, repo } = context.repo;
            const link = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const corpo = [
              marcador,
              '## Scan de segurança (Drogonsec)',
              '',
              '| Severidade | Avisos |',
              '|---|---|',
              `| Critical | ${process.env.CRITICAL} |`,
              `| High | ${process.env.HIGH} |`,
              `| Medium | ${process.env.MEDIUM} |`,
              `| Low | ${process.env.LOW} |`,
              `| **Total** | **${process.env.TOTAL}** |`,
              '',
              `O relatório completo está nos artefactos da [execução do scan](${link}).`,
            ].join('\n');

            const comentarios = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: context.issue.number }
            );
            const existente = comentarios.find(c => c.body && c.body.includes(marcador));

            if (existente) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existente.id, body: corpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body: corpo,
              });
            }

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drogonsec-report
          path: drogonsec-report.html
          if-no-files-found: warn
          retention-days: 14
